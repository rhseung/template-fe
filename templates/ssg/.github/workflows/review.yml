# AGENTS.md 기준의 아키텍처·의도 리뷰. 결정론적 React 결함을 보는 react-doctor.yml과
# 짝을 이룬다 — 이쪽은 규칙을 읽는다.
#
# 기본은 비활성. 새로 클론한 사람이 시크릿이 없다고 첫 PR부터 빨간 X를 보지 않게 하려는 것.
# 켜려면:
#   1. `claude setup-token`  (Claude Pro/Max면 추가 과금 0)
#   2. 레포 시크릿  CLAUDE_CODE_OAUTH_TOKEN = <토큰>
#   3. 레포 변수    ENABLE_CLAUDE_REVIEW    = true
#
# 설정이 아예 싫으면 CodeRabbit GitHub App을 깐다 — 공개 레포 영구 무료, 워크플로 파일 0개,
# 그리고 이 워크플로가 못 하는 포크 PR 리뷰까지 된다.
name: review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude:
    # 1) 옵트인 게이트  2) 포크 PR엔 시크릿이 없으므로 빨갛게 실패시키지 말고 건너뛴다
    if: >-
      ${{ vars.ENABLE_CLAUDE_REVIEW == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          prompt: |
            Review this PR against AGENTS.md in the repo root.

            Look for what a linter cannot see:
            - MVVM layer violations that slipped past eslint-plugin-boundaries
            - a View importing `@/api` or a ViewModel reaching into UI
            - a new component shipped without `index.stories.tsx`
            - user-facing strings that skipped the i18n namespace
            - stale closures, effect ordering, cache invalidation that never fires
            - dead abstraction: an interface with one implementation, config for a
              value that never changes, a wrapper that only forwards

            Do NOT mention anything ESLint, Prettier or TypeScript already catch.
            Inline comments for specific lines, one short top-level summary.
            Respond in Korean.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
